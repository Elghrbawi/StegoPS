<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STEGOPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--ac:#00e5c8;--bg:#070d10;--s:#0b1c22;--s2:#0f2028;
--br:#1a3d4a;--tx:#dff0ec;--dm:#7aa8a0;--mu:#3d6e66;--dn:#ff4d6d;
--f:'Space Mono',monospace;
}
html,body{width:290px;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:12px;}
.hdr{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--s);border-bottom:1px solid var(--br);}
.logo{width:20px;height:20px;flex-shrink:0;}
.hdr-name{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--ac);}
.srv{margin-left:auto;font-size:8px;padding:2px 6px;border:1px solid;letter-spacing:.4px;}
.ok{color:#4ade80;border-color:#4ade80;}
.chk{color:var(--mu);border-color:var(--mu);}
.err{color:var(--dn);border-color:var(--dn);}
.quote-block{padding:16px 13px;border-bottom:1px solid var(--br);}
.q{font-size:10px;color:var(--mu);line-height:1.75;font-style:italic;letter-spacing:.15px;margin-bottom:10px;}
.by{font-size:8px;color:var(--br);letter-spacing:.8px;}
.by a{color:var(--br);text-decoration:none;}
.by a:hover{color:var(--mu);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-bottom:1px solid var(--br);}
.tl{font-size:10px;color:var(--dm);letter-spacing:.3px;}
.tog{position:relative;width:36px;height:19px;cursor:pointer;}
.tog input{opacity:0;width:0;height:0;position:absolute;}
.tog-t{position:absolute;inset:0;background:var(--s2);border:1px solid var(--br);transition:border-color .15s;}
.tog input:checked~.tog-t{border-color:var(--ac);}
.tog-k{position:absolute;top:3px;left:3px;width:11px;height:11px;background:var(--mu);transition:transform .15s,background .15s;pointer-events:none;}
.tog input:checked~.tog-t .tog-k{transform:translateX(17px);background:var(--ac);}
.state{padding:10px 13px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:7px;}
.dot{width:5px;height:5px;background:var(--mu);flex-shrink:0;transition:background .2s;}
.dot.live{background:var(--ac);animation:bl 2.5s ease-in-out infinite;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.state-txt{font-size:9px;color:var(--mu);letter-spacing:.5px;transition:color .2s;}
.state-txt.live{color:var(--ac);}
.foot{padding:7px 13px;font-size:8px;color:var(--mu);background:var(--s);display:flex;justify-content:space-between;}
</style>
</head>
<body>
<div class="hdr">
<svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="48" height="48" fill="#070d10"/>
<path d="M7 24C11 15 18 11 24 11C30 11 37 15 41 24C37 33 30 37 24 37C18 37 11 33 7 24Z" stroke="#00e5c8" stroke-width="1.6" fill="none"/>
<circle cx="24" cy="24" r="7" stroke="#00e5c8" stroke-width="1.4" fill="none"/>
<circle cx="24" cy="24" r="3" fill="#00e5c8"/>
<line x1="17" y1="38" x2="17" y2="43" stroke="#00e5c8" stroke-width="1.2"/>
<line x1="21" y1="39.5" x2="21" y2="44.5" stroke="#00e5c8" stroke-width="1.2"/>
<line x1="24" y1="40" x2="24" y2="45" stroke="#00e5c8" stroke-width="1.2"/>
<line x1="27" y1="39.5" x2="27" y2="44.5" stroke="#00e5c8" stroke-width="1.2"/>
<line x1="31" y1="38" x2="31" y2="43" stroke="#00e5c8" stroke-width="1.2"/>
</svg>
<span class="hdr-name">STEGOPS</span>
<span class="srv chk" id="srv">CHECKING</span>
</div>
<div class="quote-block">
<div class="q" id="qt"></div>
<div class="by">— <a href="https://therasputin64.github.io/" target="_blank">TheRasputin64</a></div>
</div>
<div class="toggle-row">
<span class="tl">enable stegops</span>
<label class="tog">
<input type="checkbox" id="tog">
<div class="tog-t"><div class="tog-k"></div></div>
</label>
</div>
<div class="state">
<div class="dot" id="dot"></div>
<span class="state-txt" id="stxt">inactive</span>
</div>
<div class="foot">
<span>DCT · LSB · v3.1</span>
<span id="ft"></span>
</div>
<script>
const BR=globalThis.browser??globalThis.chrome;
const $=id=>document.getElementById(id);
const QQ=[
"every image is a grave for words nobody said out loud.",
"the message was always there. nobody thought to look.",
"silence is just data with no receiver.",
"they read everything you write. they can't read light.",
"some things survive by hiding inside plain sight.",
"the eye sees the image. it never sees what's inside.",
"you were always transmitting. just not to them.",
"nothing is truly hidden. it's just waiting for the right eyes.",
"secrets don't disappear — they become invisible.",
"the loudest message is the one no one can hear.",
];
$('qt').textContent=QQ[Math.floor(Math.random()*QQ.length)];
let cfg={enabled:true};
let ready=false;
function applyUI(){
const on=cfg.enabled!==false;
$('tog').checked=on;
$('dot').className='dot'+(on?' live':'');
$('stxt').className='state-txt'+(on?' live':'');
$('stxt').textContent=on?'active — scanning images':'inactive — stegops disabled';
}
BR.storage.local.get('cfg').then(r=>{
if(r.cfg)cfg={...cfg,...r.cfg};
ready=true;
applyUI();
}).catch(()=>{ready=true;applyUI();});
$('tog').onchange=function(){
if(!ready)return;
cfg.enabled=this.checked;
BR.storage.local.set({cfg},()=>{
applyUI();
BR.tabs.query({active:true,currentWindow:true},tabs=>{
const t=tabs[0];
if(t&&t.url&&t.url.includes('web.whatsapp.com'))
BR.tabs.sendMessage(t.id,{type:'CFG_UPDATE',cfg}).catch(()=>{});
});
});
};
function checkSrv(){
BR.runtime.sendMessage({type:'GET_HEALTH'}).then(r=>{
const el=$('srv');
if(r&&r.ok){el.textContent='SERVER OK';el.className='srv ok';}
else{el.textContent='SERVER DOWN';el.className='srv err';}
}).catch(()=>{$('srv').textContent='SERVER DOWN';$('srv').className='srv err';});
}
checkSrv();
setInterval(checkSrv,5000);
const cl=()=>{$('ft').textContent=new Date().toLocaleTimeString();};
cl();setInterval(cl,1000);
</script>
</body>
</html>
